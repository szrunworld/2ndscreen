[project]
name = "monitor-contracts"
version = "0.3.1"
description = "招聘 Monitor 模块间契约：JSON Schema、pydantic 模型、状态机、Protocol"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.8,<3",
    "jsonschema>=4.23,<5",
    "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitor_contracts"]

# 打包时把 schemas/ 一并放进包内；可编辑安装时由 _schemas.py 回退到源码目录。
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "monitor_contracts/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
pythonpath = ["tests"]
