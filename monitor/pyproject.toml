# 招聘 Monitor 的 uv 工作区根（虚拟根：没有 [project]，本身不是可安装包）。
# 成员由各任务在交付时加入 members；任务 A 只建立根与 contracts。
# 在本目录执行 `uv sync` 会安装全部成员与 dev 依赖组。
[tool.uv.workspace]
members = ["contracts", "client", "server"]

[tool.uv]
# Monitor 统一使用 Python 3.12（成员各自声明 requires-python = "==3.12.*"）。
python-preference = "managed"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "openapi-spec-validator>=0.7.1",
    "pyyaml>=6.0",
]
