# 招聘 Monitor 本机客户端（uv 工作区成员 monitor-client）。
# 任务 C 创建本文件，只写入 Driver 适配器需要的依赖；其他任务按需追加。
[project]
name = "monitor-client"
version = "0.1.0"
description = "招聘 Monitor 本机客户端"
requires-python = "==3.12.*"
dependencies = [
    "monitor-contracts",
]

# 客户端暂未列入工作区 members（根 pyproject 归任务 A），先用路径依赖；
# 加入工作区后可改为 { workspace = true }。
[tool.uv.sources]
monitor-contracts = { path = "../contracts", editable = true }

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
