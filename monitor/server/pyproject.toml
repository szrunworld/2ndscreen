# 招聘 Monitor 服务端（F1：设备、指令队列、事件接收；F2/F3 在同一包内扩展）。
[project]
name = "monitor-server"
version = "0.1.0"
description = "招聘 Monitor 服务端：FastAPI + SQLite（存储层接口化，预留 PostgreSQL）"
requires-python = "==3.12.*"
dependencies = [
    "monitor-contracts",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
# 已列入工作区 members（协调者合并 F1 时加入）。
monitor-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
pythonpath = [".", "tests"]
# starlette 对 httpx 的弃用提示与本项目无关
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
